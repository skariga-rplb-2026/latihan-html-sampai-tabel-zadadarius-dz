<html>
    <head>
        <title>Latihan Font</title>
    </head>
    <body>
        <h1>Latihan Font</h1>
        <hr> <!--Ini garis horizonatal-->
        Ini font normal <br>
        <p>
            <b>Ini font bold</b>
        </p>
        <p>
          <i>Ini font italic</i>  
        </p>
        <p>
            <strong>Ini font dengan tang strong</strong>
        </p>
        <p>
            <u>Ini font dengan underline</u>
        </p>
        <p>
            <mark>Ini font dengan highlight</mark>
        </p>
        <p>
           <small>Ini font dengan tag small, catatan kecil</small> 
        </p>
        <p>
            <del>Ini font dengan tag del</del>
        </p>
        <p>
           Ini contoh sub, H<sub>2</sub>O <br> 
        </p>
        <p>
            Ini contoh sup, CO<sup>2</sup>
        </p>
        <p>
            Ini karakter untun Copyright &copy;
        </p>
    </body>
</html>
