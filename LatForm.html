<html>
    <head>
       <title>Latihan Form</title> 
    </head>
    <body>
        <h3>Latihan Form</h3>

        <form action="#" method="POST">
            Nama : <input type="text" name="first_name" size="50"><br>
            Umur : <input type="number" number="umur" size="50"><br>
            Warna : <input type="color" color="color" size="50"><br>
            Tanggal : <input type="date" date="Tanggal" size="50"><br>
            Email : <input type="Email" email="Email" size="50"><br>
            File : <input type="File" file="File" size="50"><br>
            Hidden : <input type="hidden" hidden="Hidden" size="50"><br>
            Bulan : <input type="Month" month="Month" size="50"><br>
            Kata Sandi : <input type="password" password="Password" size="50"><br>
            Range : <input type="Range" range="Range" size="50"><br>
            Pencarian : <input type="search" search="Search" size="50"><br>
            Telepon : <input type="number" tel="Tel" size="50"><br>
            Jam : <input type="Time" time="Time" size="50"><br>
            Seminggu : <input type="Week" week="Week" size="50"><br>
        </form>
    </body>
</html>
